name: Verify engine

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, diagnose, build, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the engine repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Use pnpm 11.3.0
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run Astro and example-content diagnostics
        run: pnpm check

      - name: Build clean example-content output
        run: pnpm build:clean

      - name: Install the Chromium smoke-test runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests against the built output
        run: pnpm test:smoke
